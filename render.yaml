services:
  - type: web
    name: mau-isims
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/dashboard
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/mau-isims.sqlite
    disk:
      name: mau-isims-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
